<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3f534f" />
  <title>L'Espaseta — Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estil.css" />
</head>
<body>
  <main class="wrap">
    <header class="marca">espaseta<b>_backyard</b> // bellpuig</header>

    <h1 class="titol">
      <span class="linia l1">L'ESPASETA</span>
      <span class="linia l2">RACE</span>
      <span class="linia l3">BELLPUIG</span>
    </h1>

    <section class="joc" id="game">
      <div class="hud">
        <span class="hud-item" id="gameLaps">Volta 1</span>
        <span class="hud-item" id="gameScore">00000 m</span>
        <span class="hud-item right" id="gameBest">Rècord: 0 m</span>
      </div>

      <div class="pista" id="pista">
        <canvas id="gameCanvas"></canvas>
      </div>

      <p class="hint" id="gameHint">// ← → o A/D per canviar de carril · Espai per començar</p>
    </section>

    <nav class="controls">
      <button class="btn" id="btnStart">▶&nbsp; COMENÇAR</button>
      <button class="btn ghost" id="btnReset">↺&nbsp; REINICIAR</button>
    </nav>
  </main>

  <script src="race.js"></script>
</body>
</html>
